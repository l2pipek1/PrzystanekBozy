
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Żywa Ewangelia — Przystanek Boży</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(circle,#172b4c,#071225 75%);
  color:#f5e8c8;font-family:Georgia,serif;
   min-height:100vh;display:flex;align-items:center;
    justify-content:center;overflow:hidden
    }
    .app{width:100%;max-width:520px;padding:14px;text-align:center}
    .brand{font:12px Arial;letter-spacing:4px;color:#d9b66d;margin:8px}
    h1{font-size:25px;font-weight:normal;margin:8px}
    .sub{font:11px Arial;letter-spacing:2px;color:#c5a96c}
    .book{
     position:relative;margin:22px auto 15px;
      width:100%;height:min(66vh,620px);min-height:390px;
       perspective:1500px
       }
       .page{
        position:absolute;inset:0;
         background:linear-gradient(110deg,#f3e7c9,#e7d5ad);
          color:#302719;border:5px double #b18b49;
           border-radius:5px 15px 15px 5px;
            padding:30px 24px;overflow:hidden;
             box-shadow:0 12px 35px #0009;
              display:flex;flex-direction:column;
               transform-origin:left center;
                backface-visibility:hidden
                }
                .page:before{
                 content:"";position:absolute;left:12px;top:0;bottom:0;
                  border-left:1px solid #c6ad7d
                  }
                  .page.turn{animation:turn .8s ease-in-out}
                  @keyframes turn{
                   0%{transform:rotateY(0);opacity:1}
                    45%{transform:rotateY(-85deg);opacity:.5}
                     100%{transform:rotateY(0);opacity:1}
                     }
                     .chapter{
                      color:#8a642d;font-size:13px;letter-spacing:2px;
                       margin-bottom:18px;text-transform:uppercase
                       }
                       .verses{
                        text-align:left;font-size:clamp(14px,3.8vw,18px);
                         line-height:1.65;overflow:hidden;white-space:pre-wrap;
                          flex:1
                          }
                          .number{font-size:11px;color:#967746;margin-top:12px}
                          .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
                          button{
                           background:#c5a05c;color:#101a2b;border:0;
                            border-radius:30px;padding:12px 17px;
                             font-weight:bold;font-size:13px
                             }
                             button.secondary{background:#263b5b;color:#f5e8c8;border:1px solid #b18b49}
                             .info{font:11px Arial;color:#c5b68f;margin:13px}
                             .audio{font:12px Arial;margin:12px;color:#dfc994}
                             input{accent-color:#c5a05c;width:110px;vertical-align:middle}
                             .status{font:12px Arial;color:#dfc994;margin:10px}
                             </style>
                             </head>
                             <body>
                             <div class="app">
                              <div class="brand">✦ PRZYSTANEK BOŻY ✦</div>
                               <h1>Żywa Ewangelia</h1>
                                <div class="sub">WEDŁUG ŚWIĘTEGO MATEUSZA</div>

                                 <div class="book">
                                   <div class="page" id="page">
                                      <div class="chapter" id="chapter">Przygotowywanie Ewangelii</div>
                                         <div class="verses" id="verses">Chwileczkę… pobieram tekst Pisma Świętego.</div>
                                            <div class="number" id="number">Przystanek Boży</div>
                                              </div>
                                               </div>

                                                <div class="controls">
                                                  <button class="secondary" onclick="previousPage()">← Wstecz</button>
                                                    <button onclick="toggleAuto()" id="autoBtn">▶ Automatycznie</button>
                                                      <button class="secondary" onclick="nextPage()">Dalej →</button>
                                                       </div>

                                                        <div class="audio">
                                                          <button onclick="toggleMusic()" id="musicBtn">♫ Włącz organy</button>
                                                            <br><br>
                                                              Głośność:
                                                                <input type="range" min="0" max="35" value="12" id="volume">
                                                                 </div>

                                                                  <div class="status" id="status">Ładowanie tekstu…</div>
                                                                   <div class="info">Strona zmienia się co 30 sekund · Biblia Gdańska</div>
                                                                    <button class="secondary" onclick="fullScreen()">⛶ Pełny ekran</button>
                                                                    </div>

                                                                    <script>
                                                                    const API="https://pl.wikisource.org/w/api.php";
                                                                    const TITLE="Biblia Gdańska/Ewangelia wg św. Mateusza (całość)";
                                                                    let pages=[],index=0,timer=null,musicOn=false;
                                                                    let audioCtx=null,master=null,musicNodes=[];

                                                                    async function loadBible(){
                                                                     try{
                                                                       const url=API+"?action=parse&page="+encodeURIComponent(TITLE)+
                                                                          "&prop=text&format=json&origin=*";
                                                                            const response=await fetch(url);
                                                                              if(!response.ok)throw new Error("Błąd połączenia");
                                                                                const data=await response.json();
                                                                                  if(!data.parse)throw new Error("Nie znaleziono tekstu");

                                                                                    const doc=new DOMParser().parseFromString(data.parse.text["*"],"text/html");
                                                                                      const root=doc.querySelector(".mw-parser-output")||doc.body;
                                                                                        const elements=[...root.querySelectorAll("h2,h3,p")];
                                                                                          let blocks=[];

                                                                                            for(const el of elements){
                                                                                               if(el.closest(".navbox,.metadata,.mw-editsection"))continue;
                                                                                                  let text=(el.innerText||el.textContent||"").trim();
                                                                                                     text=text.replace(/\[edytuj\]/gi,"").trim();
                                                                                                        if(!text)continue;
                                                                                                           if(el.tagName==="H2"||el.tagName==="H3"){
                                                                                                               if(/Mt\s*\d+/i.test(text))blocks.push("\n\n"+text.toUpperCase()+"\n");
                                                                                                                  }else if(text.length>8){
                                                                                                                      blocks.push(text);
                                                                                                                         }
                                                                                                                           }

                                                                                                                             const full=blocks.join("\n\n");
                                                                                                                               if(full.length<10000)throw new Error("Tekst jest niekompletny");

                                                                                                                                 const max=1050;
                                                                                                                                   let rest=full.trim();
                                                                                                                                     while(rest.length){
                                                                                                                                        let cut=Math.min(max,rest.length);
                                                                                                                                           if(cut<rest.length){
                                                                                                                                               let space=rest.lastIndexOf(" ",cut);
                                                                                                                                                   if(space>max*.65)cut=space;
                                                                                                                                                      }
                                                                                                                                                         pages.push(rest.slice(0,cut).trim());
                                                                                                                                                            rest=rest.slice(cut).trim();
                                                                                                                                                              }

                                                                                                                                                                document.getElementById("status").textContent=
                                                                                                                                                                   "Załadowano tekst · "+pages.length+" stron";
                                                                                                                                                                     showPage();
                                                                                                                                                                      }catch(e){
                                                                                                                                                                        document.getElementById("chapter").textContent="Nie udało się załadować";
                                                                                                                                                                          document.getElementById("verses").textContent=
                                                                                                                                                                             "Sprawdź połączenie z internetem i odśwież stronę. "+
                                                                                                                                                                                "Źródło tekstu: Wikiźródła — Biblia Gdańska.";
                                                                                                                                                                                  document.getElementById("status").textContent=e.message;
                                                                                                                                                                                   }
                                                                                                                                                                                   }

                                                                                                                                                                                   function showPage(){
                                                                                                                                                                                    if(!pages.length)return;
                                                                                                                                                                                     const text=pages[index];
                                                                                                                                                                                      const match=text.match(/Mt\s*\d+/i);
                                                                                                                                                                                       document.getElementById("chapter").textContent=
                                                                                                                                                                                         match?match[0]:"Ewangelia według św. Mateusza";
                                                                                                                                                                                          document.getElementById("verses").textContent=text;
                                                                                                                                                                                           document.getElementById("number").textContent=
                                                                                                                                                                                             "Strona "+(index+1)+" / "+pages.length;
                                                                                                                                                                                             }

                                                                                                                                                                                             function animate(){
                                                                                                                                                                                              const page=document.getElementById("page");
                                                                                                                                                                                               page.classList.remove("turn");
                                                                                                                                                                                                void page.offsetWidth;
                                                                                                                                                                                                 page.classList.add("turn");
                                                                                                                                                                                                 }

                                                                                                                                                                                                 function nextPage(){
                                                                                                                                                                                                  if(!pages.length)return;
                                                                                                                                                                                                   index=(index+1)%pages.length;
                                                                                                                                                                                                    animate();showPage();
                                                                                                                                                                                                    }
                                                                                                                                                                                                    function previousPage(){
                                                                                                                                                                                                     if(!pages.length)return;
                                                                                                                                                                                                      index=(index-1+pages.length)%pages.length;
                                                                                                                                                                                                       animate();showPage();
                                                                                                                                                                                                       }
                                                                                                                                                                                                       function toggleAuto(){
                                                                                                                                                                                                        if(timer){
                                                                                                                                                                                                          clearInterval(timer);timer=null;
                                                                                                                                                                                                            document.getElementById("autoBtn").textContent="▶ Automatycznie";
                                                                                                                                                                                                             }else{
                                                                                                                                                                                                               timer=setInterval(nextPage,30000);
                                                                                                                                                                                                                 document.getElementById("autoBtn").textContent="Ⅱ Zatrzymaj";
                                                                                                                                                                                                                  }
                                                                                                                                                                                                                  }
                                                                                                                                                                                                                  function fullScreen(){
                                                                                                                                                                                                                   if(!document.fullscreenElement){
                                                                                                                                                                                                                     document.documentElement.requestFullscreen?.();
                                                                                                                                                                                                                      }else{
                                                                                                                                                                                                                        document.exitFullscreen?.();
                                                                                                                                                                                                                         }
                                                                                                                                                                                                                         }

                                                                                                                                                                                                                         /* Oryginalne, spokojne brzmienie organowe */
                                                                                                                                                                                                                         function toggleMusic(){
                                                                                                                                                                                                                          if(musicOn){
                                                                                                                                                                                                                            musicNodes.forEach(n=>{try{n.stop()}catch(e){}});
                                                                                                                                                                                                                              musicNodes=[];musicOn=false;
                                                                                                                                                                                                                                document.getElementById("musicBtn").textContent="♫ Włącz organy";
                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                    try{
                                                                                                                                                                                                                                      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
                                                                                                                                                                                                                                        master=audioCtx.createGain();
                                                                                                                                                                                                                                          master.gain.value=Number(document.getElementById("volume").value)/100;
                                                                                                                                                                                                                                            master.connect(audioCtx.destination);

                                                                                                                                                                                                                                              const chords=[
                                                                                                                                                                                                                                                 [130.81,164.81,196.00],
                                                                                                                                                                                                                                                    [110.00,130.81,164.81],
                                                                                                                                                                                                                                                       [146.83,174.61,220.00],
                                                                                                                                                                                                                                                          [98.00,130.81,164.81]
                                                                                                                                                                                                                                                            ];
                                                                                                                                                                                                                                                              let step=0;
                                                                                                                                                                                                                                                                function playChord(){
                                                                                                                                                                                                                                                                   if(!musicOn)return;
                                                                                                                                                                                                                                                                      const now=audioCtx.currentTime;
                                                                                                                                                                                                                                                                         const chord=chords[step%chords.length];
                                                                                                                                                                                                                                                                            chord.forEach((freq,i)=>{
                                                                                                                                                                                                                                                                                const osc=audioCtx.createOscillator();
                                                                                                                                                                                                                                                                                    const gain=audioCtx.createGain();
                                                                                                                                                                                                                                                                                        osc.type="sine";
                                                                                                                                                                                                                                                                                            osc.frequency.value=freq;
                                                                                                                                                                                                                                                                                                gain.gain.setValueAtTime(0,now);
                                                                                                                                                                                                                                                                                                    gain.gain.linearRampToValueAtTime(.12,now+2);
                                                                                                                                                                                                                                                                                                        gain.gain.setTargetAtTime(0,now+7,2);
                                                                                                                                                                                                                                                                                                            osc.connect(gain);gain.connect(master);
                                                                                                                                                                                                                                                                                                                osc.start(now);osc.stop(now+13);
                                                                                                                                                                                                                                                                                                                    musicNodes.push(osc);
                                                                                                                                                                                                                                                                                                                       });
                                                                                                                                                                                                                                                                                                                          step++;
                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                              musicOn=true;
                                                                                                                                                                                                                                                                                                                                playChord();
                                                                                                                                                                                                                                                                                                                                  const interval=setInterval(()=>{
                                                                                                                                                                                                                                                                                                                                     if(!musicOn){clearInterval(interval);return}
                                                                                                                                                                                                                                                                                                                                        playChord();
                                                                                                                                                                                                                                                                                                                                          },9000);
                                                                                                                                                                                                                                                                                                                                            musicNodes.push({stop:()=>clearInterval(interval)});
                                                                                                                                                                                                                                                                                                                                              document.getElementById("musicBtn").textContent="♫ Wyłącz organy";
                                                                                                                                                                                                                                                                                                                                               }catch(e){
                                                                                                                                                                                                                                                                                                                                                 document.getElementById("status").textContent="Nie można uruchomić dźwięku.";
                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                  document.getElementById("volume").addEventListener("input",e=>{
                                                                                                                                                                                                                                                                                                                                                   if(master)master.gain.value=Number(e.target.value)/100;
                                                                                                                                                                                                                                                                                                                                                   });

                                                                                                                                                                                                                                                                                                                                                   loadBible();
                                                                                                                                                                                                                                                                                                                                                   </script>
                                                                                                                                                                                                                                                                                                                                                   </body>
                                                                                                                                                                                                                                                                                                                                                   </html>
